name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust-contract:
    name: Rust contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Run unit tests
        run: cargo test -p shielded-pool --lib
      - name: Build integration-test WASM (compilation check)
        # The near-workspaces sandbox portion of integration.rs / e2e_real_proofs.rs
        # is skipped here via SKIP_NEAR_INTEGRATION, so this only verifies the
        # integration-testing feature compiles to wasm. Local sandbox runs build
        # the deployable artifact via wasm-opt (see the test's error guidance).
        run: |
          cargo build -p shielded-pool --target wasm32-unknown-unknown \
            --release --no-default-features --features integration-testing
      - name: Run integration and verifier tests
        run: SKIP_NEAR_INTEGRATION=1 cargo test -p shielded-pool --tests

  deploy-safety:
    name: Deploy safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Check production-readiness script syntax
        run: bash -n scripts/check-production-readiness.sh
      - name: Production verifier compiles for WASM
        run: cargo check -p shielded-pool --lib --target wasm32-unknown-unknown --no-default-features --features groth16-verifier
      - name: Mock verifier cannot be built as default WASM
        run: |
          set +e
          cargo check -p shielded-pool --lib --target wasm32-unknown-unknown >/tmp/default-wasm.log 2>&1
          status="$?"
          set -e
          if [ "$status" -eq 0 ]; then
            echo "default WASM build unexpectedly succeeded"
            exit 1
          fi
          grep -q 'WASM contract builds must disable `unit-testing`' /tmp/default-wasm.log
      - name: Contract and circuit Merkle depths match production depth
        run: |
          grep -q 'pub const TREE_DEPTH: u8 = 20;' contract/src/lib.rs
          grep -q 'pub global MERKLE_DEPTH: u32 = 20;' circuits/shared/src/lib.nr

  noir-circuits:
    name: Noir circuit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install noirup
        run: curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
      - name: Install nargo
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          $HOME/.nargo/bin/noirup
      - name: Test circuits
        working-directory: circuits
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          nargo test --workspace

  typescript-sdk:
    name: TypeScript SDK tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, auditor, relayer, sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: sdk/packages/${{ matrix.package }}
        run: pnpm test

  typescript-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: sdk
      - name: Typecheck (tsc) all packages
        run: pnpm -r build
        working-directory: sdk

  spec-validation:
    name: Superpowers validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: tools/superpowers-validate
        run: npm ci
      - name: Run validation tests
        working-directory: tools/superpowers-validate
        run: npm test

  production-gate:
    name: Production readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-opt (binaryen)
        # Pinned to a binaryen with --llvm-memory-copy-fill-lowering (>= v116),
        # required to lower Rust >=1.87's bulk-memory ops to NEAR-deployable MVP.
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"
      - name: Build and lower deployable WASM
        run: |
          cargo build -p shielded-pool --target wasm32-unknown-unknown \
            --release --no-default-features --features groth16-verifier
          wasm-opt --enable-bulk-memory --llvm-memory-copy-fill-lowering -Oz \
            --strip-debug --strip-producers \
            target/wasm32-unknown-unknown/release/shielded_pool.wasm \
            -o target/wasm32-unknown-unknown/release/shielded_pool.opt.wasm
      - name: Run production-readiness gate
        # Generates real Groth16 proofs for all three circuits and validates the
        # deployable artifact's size + wasm feature set. CI never did this before.
        run: ./scripts/check-production-readiness.sh

  all-green:
    name: All checks passed
    needs:
      - rust-contract
      - deploy-safety
      - noir-circuits
      - typescript-sdk
      - typescript-typecheck
      - spec-validation
      - production-gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "all CI jobs passed"
