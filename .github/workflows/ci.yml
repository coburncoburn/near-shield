name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust-contract:
    name: Rust contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Run unit tests
        run: cargo test -p shielded-pool --lib

  noir-circuits:
    name: Noir circuit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install noirup
        run: curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
      - name: Install nargo
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          $HOME/.nargo/bin/noirup
      - name: Test circuits
        working-directory: circuits
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          nargo test --workspace

  typescript-sdk:
    name: TypeScript SDK tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, auditor, relayer, sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Run tests
        working-directory: sdk/packages/${{ matrix.package }}
        run: pnpm test

  all-green:
    name: All checks passed
    needs: [rust-contract, noir-circuits, typescript-sdk]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all CI jobs passed"
