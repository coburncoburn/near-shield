[package]
name = "shielded-pool"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Used during local development. WASM builds with this feature are rejected
# unless `integration-testing` is also enabled (see verifier.rs).
default = ["unit-testing"]
unit-testing = ["near-sdk/unit-testing"]
# Permissive verifier for near-workspaces sandbox tests. Allowed on WASM but
# clearly not for production.
integration-testing = []
# Fail-closed legacy verifier path. Kept only so old deploy commands cannot
# accidentally accept proofs while Barretenberg/Honk work remains out of tree.
bb-verifier = []
# Real Groth16 verifier using NEAR's alt_bn128 host functions. This is the
# current deployable verifier feature, gated by the real shielded-pool prover
# and WASM size checks in scripts/check-production-readiness.sh.
groth16-verifier = []

[dependencies]
near-sdk = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-workspaces = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
light-poseidon = { version = "0.2", default-features = false }
ark-groth16 = { version = "0.4", default-features = false }
ark-snark = { version = "0.4", default-features = false }
ark-relations = { version = "0.4", default-features = false }
ark-r1cs-std = { version = "0.4", default-features = false }
ark-ec = { version = "0.4", default-features = false }
ark-ff = { version = "0.4", default-features = false }
ark-serialize = { version = "0.4", default-features = false }
ark-std = { version = "0.4", default-features = false, features = ["std"] }
ark-bn254 = { version = "0.4", default-features = false, features = ["curve"] }
sha2 = { version = "0.10", features = ["std"] }
