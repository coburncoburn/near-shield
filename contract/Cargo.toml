[package]
name = "shielded-pool"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Used during local development. WASM builds with this feature are rejected
# unless `integration-testing` is also enabled (see verifier.rs).
default = ["unit-testing"]
unit-testing = ["near-sdk/unit-testing"]
# Permissive verifier for near-workspaces sandbox tests. Allowed on WASM but
# clearly not for production. Mutually distinct from `bb-verifier` so it can
# never silently slip into a deployable artifact.
integration-testing = []
# Placeholder feature for the production verifier path. It currently fails
# closed until Barretenberg verification is wired in.
bb-verifier = []

[dependencies]
near-sdk = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
light-poseidon = "0.2"
ark-bn254 = "0.4"
ark-ff = "0.4"
hex = "0.4"

[dev-dependencies]
near-workspaces = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
